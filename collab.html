<!DOCTYPE html>
<html lang="ru" style="color-scheme:light !important;background:#FFF9F5 !important">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Коллаборация — prët</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;1,400&family=PT+Serif+Caption:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light !important;
    --navy:#0B1E3C;
    --blue:#4A7BA7;
    --cream:#FFF9F5;
    --ink:#2B1810;
    --display:'Averia Serif Libre','PT Serif Caption',Georgia,serif;
    --ui:'IBM Plex Sans',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;color-scheme:light !important;background:#FFF9F5 !important}
  body{
    font-family:var(--display);
    color:#2B1810 !important;background:#FFF9F5 !important;
    line-height:1.6;overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    forced-color-adjust:none;
  }

  @media(prefers-color-scheme:dark){
    :root{color-scheme:light !important}
    html,body{background:#FFF9F5 !important;color:#2B1810 !important}
    .proj-hero{background:#0B1E3C !important;color:#FFF9F5 !important}
    .proj-body{background:#FFF9F5 !important}
    .logo,nav a,.lang-toggle{color:#2B1810 !important}
    .proj-cover img{filter:none !important}
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 48px;
    background:rgba(255,249,245,.96);backdrop-filter:blur(10px);
    color:#2B1810;
  }
  .logo{
    font-family:var(--display);font-size:32px;font-style:italic;
    text-decoration:none;font-weight:400;
    color:#2B1810;-webkit-text-fill-color:#2B1810;
  }
  nav{display:flex;gap:32px;align-items:center}
  nav a{
    text-decoration:none;
    color:#2B1810;-webkit-text-fill-color:#2B1810;
    font-family:var(--ui);font-size:12px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    transition:opacity .2s;
  }
  nav a:hover{opacity:.6}
  .lang-toggle{
    font-size:12px;padding:5px 11px;
    border:1.5px solid #2B1810;border-radius:4px;
    background:none;cursor:pointer;
    font-family:var(--ui);font-weight:600;
    color:#2B1810;-webkit-text-fill-color:#2B1810;
    transition:background .2s,color .2s;
  }
  .lang-toggle:hover{
    background:#2B1810;
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
  }

  /* ── ШАПКА ПРОЕКТА ── */
  .proj-hero{
    background:#0B1E3C;
    padding:150px 48px 70px;
    color:#FFF9F5;
  }
  .proj-hero .wrap{max-width:1000px;margin:0 auto}
  .back{
    display:inline-block;
    font-family:var(--ui);font-size:12px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
    text-decoration:none;opacity:.55;margin-bottom:34px;
    transition:opacity .2s;
  }
  .back:hover{opacity:1}
  .proj-hero h1{
    font-family:var(--display);font-style:italic;font-weight:400;
    font-size:clamp(40px,7vw,92px);
    line-height:1.05;letter-spacing:-.02em;
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
  }
  .proj-meta{
    margin-top:22px;
    font-family:var(--ui);font-size:12px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
    opacity:.55;
  }

  /* ── ОБЛОЖКА ── */
  .proj-cover{background:#0B1E3C;padding:0 48px 90px}
  .proj-cover .wrap{max-width:1000px;margin:0 auto}
  .proj-cover img{
    width:100%;height:auto;display:block;
    border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
  }

  /* ── ТЕКСТ ── */
  .proj-body{background:#FFF9F5;padding:90px 48px 70px}
  .proj-body .wrap{max-width:760px;margin:0 auto}
  .proj-lead{
    font-family:var(--display);font-style:italic;
    font-size:clamp(22px,3vw,36px);
    line-height:1.35;color:#2B1810;-webkit-text-fill-color:#2B1810;
    margin-bottom:38px;
  }
  .proj-body p{
    font-family:'PT Serif Caption','Lora',Georgia,serif;
    font-size:clamp(16px,1.7vw,19px);
    line-height:1.8;color:#2B1810;-webkit-text-fill-color:#2B1810;
    margin-bottom:24px;
  }

  /* ── ГАЛЕРЕЯ ПРОЕКТА ── */
  .proj-gallery{background:#FFF9F5;padding:20px 48px 90px}
  .proj-gallery .wrap{
    max-width:1000px;margin:0 auto;
    display:grid;grid-template-columns:repeat(2,1fr);gap:22px;
  }
  .proj-gallery img{
    width:100%;height:auto;display:block;
    border-radius:12px;
    box-shadow:0 12px 34px rgba(43,24,16,.14);
  }
  .proj-gallery .wide{grid-column:1 / -1}

  /* ── ССЫЛКА И ПЕРЕХОД ── */
  .proj-link{
    background:#FFF9F5;padding:0 48px 90px;
    text-align:center;
  }
  .proj-link a{
    display:inline-block;
    padding:14px 38px;
    border:1.5px solid #2B1810;border-radius:40px;
    font-family:var(--ui);font-size:12px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    color:#2B1810;-webkit-text-fill-color:#2B1810;
    text-decoration:none;
    transition:background .25s,color .25s;
  }
  .proj-link a:hover{
    background:#2B1810;
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
  }

  .proj-next{
    background:#0B1E3C;padding:80px 48px;
    text-align:center;
  }
  .proj-next a{
    font-family:var(--display);font-style:italic;
    font-size:clamp(24px,4vw,48px);
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
    text-decoration:none;
    transition:opacity .25s;
  }
  .proj-next a:hover{opacity:.65}
  .proj-next .lbl{
    display:block;
    font-family:var(--ui);font-size:11px;font-weight:600;
    letter-spacing:.2em;text-transform:uppercase;
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
    opacity:.45;margin-bottom:14px;
  }

  footer{background:#4A7BA7;padding:60px 48px 40px;text-align:center}
  footer p{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    font-family:var(--ui);
    color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
    opacity:.55;
  }

  .not-found{
    display:none;
    padding:200px 48px;text-align:center;
    font-family:var(--display);font-style:italic;
    font-size:clamp(20px,3vw,34px);
    color:#2B1810;-webkit-text-fill-color:#2B1810;
  }

  @media(max-width:900px){
    header{padding:10px 16px}
    .logo{font-size:18px}
    nav{gap:8px}
    nav a{font-size:8px;letter-spacing:.06em}
    .lang-toggle{font-size:8px;padding:2px 6px}

    .proj-hero{padding:104px 16px 44px}
    .back{margin-bottom:22px;font-size:9px}
    .proj-hero h1{font-size:clamp(28px,9vw,44px)}
    .proj-meta{margin-top:14px;font-size:9px}

    .proj-cover{padding:0 16px 52px}
    .proj-cover img{border-radius:9px}

    .proj-body{padding:52px 16px 40px}
    .proj-lead{font-size:clamp(17px,5.2vw,23px);margin-bottom:24px}
    .proj-body p{font-size:clamp(14px,4vw,16px);line-height:1.7;margin-bottom:18px}

    .proj-gallery{padding:12px 16px 52px}
    .proj-gallery .wrap{grid-template-columns:1fr;gap:14px}
    .proj-gallery img{border-radius:8px}

    .proj-link{padding:0 16px 52px}
    .proj-link a{padding:11px 26px;font-size:10px}

    .proj-next{padding:52px 16px}
    .proj-next a{font-size:clamp(20px,6.4vw,30px)}
    .proj-next .lbl{font-size:8px;margin-bottom:10px}

    footer{padding:36px 16px 24px}
    footer p{font-size:8px}

    .not-found{padding:140px 16px;font-size:clamp(16px,5vw,22px)}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="./index.html">prët</a>
  <nav>
    <a href="./index.html#journey" data-ru="Галерея" data-en="Gallery">Галерея</a>
    <a href="./shop.html" data-ru="Магазин" data-en="Shop">Магазин</a>
    <a href="./about.html" data-ru="О&nbsp;себе" data-en="About">О&nbsp;себе</a>
    <a href="./index.html#contact" data-ru="Контакты" data-en="Contact">Контакты</a>
    <button class="lang-toggle" id="langBtn" type="button">EN</button>
  </nav>
</header>

<div id="content" style="display:none">
  <section class="proj-hero">
    <div class="wrap">
      <a class="back" href="./index.html#collab"
         data-ru="← Все коллаборации" data-en="← All collaborations">← Все коллаборации</a>
      <h1 id="pTitle"></h1>
      <div class="proj-meta" id="pMeta"></div>
    </div>
  </section>

  <section class="proj-cover">
    <div class="wrap">
      <img id="pCover" src="" alt="">
    </div>
  </section>

  <section class="proj-body">
    <div class="wrap">
      <div class="proj-lead" id="pLead"></div>
      <div id="pText"></div>
    </div>
  </section>

  <section class="proj-gallery" id="pGallerySec" style="display:none">
    <div class="wrap" id="pGallery"></div>
  </section>

  <section class="proj-link" id="pLinkSec" style="display:none">
    <a id="pLink" href="#" target="_blank" rel="noopener"
       data-ru="Смотреть проект" data-en="View project">Смотреть проект</a>
  </section>

  <section class="proj-next">
    <span class="lbl" data-ru="Следующая коллаборация" data-en="Next collaboration">Следующая коллаборация</span>
    <a id="pNext" href="#"></a>
  </section>
</div>

<div class="not-found" id="notFound">
  Такой коллаборации нет. <a href="./index.html#collab" style="color:inherit">Вернуться</a>
</div>

<footer>
  <p>© 2026 prët — maria balayan</p>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ДАННЫЕ КОЛЛАБОРАЦИЙ
   ═══════════════════════════════════════════════════════════════════

   Чтобы добавить новый проект, скопируйте блок ниже и замените
   значения. Ключ (crystals, mountain, cat, butterfly) — это id,
   он должен совпадать с ссылкой в index.html:  collab.html?id=cat

   ── Что означает каждое поле ──
   cover   — картинка-обложка, лежит в папке img
   images  — галерея под текстом, можно перечислить несколько.
             Если не нужна — оставьте пустой массив: []
   link    — кнопка «Смотреть проект». Если не нужна, уберите строку
   ru / en — тексты на двух языках:
       title  — название
       meta   — подпись под названием (год, роль, заказчик)
       lead   — крупная вводная фраза
       body   — абзацы рассказа, каждый в кавычках через запятую
   ═══════════════════════════════════════════════════════════════════ */

const COLLABS = {

  /* ── 1. Блокноты ── */
  notes: {
    cover: 'img/collab-1.jpg',
    images: [],
    link: '',
    ru: {
      title: 'Книга танцовщика',
      meta: 'коллаборация · 2026',
      lead: 'Создание индивидуальных блокнотов для #RHIZOMELAB.',
      body: [
        'Со-творчество началось с запроса на создание мерча для грядущей танцевальной лабаратории. Задача стояла отрзить подход в работе педагогов и хореографов Анастасии Синцовой и Николая Насенкова, философию РизомаКоллаб и мое виденье. ',
        'Итогом стало создание 14 индивидуальной конфигурации блокнотов из натуральной кожи и с графировкой. Все этапы производства, за исключением гравировки, были созданы мною вручную.'
      ]
    },
    en: {
      title: 'Dancer note',
      meta: 'collaboration · 2026',
      lead: 'Creating custom notebooks for #RHIZOMELAB.',
      body: [
        'The collaboration began with a request to create merchandise for an upcoming dance laboratory. The goal was to reflect the working approach of instructors and choreographers Anastasia Sintsova and Nikolai Nasenkov, the philosophy of RhizomeCollab, and my own vision.',
        'The result was the creation of 14 custom-configured, engraved genuine leather notebooks. I crafted every stage of production by hand, with the exception of the engraving..'
      ]
    }
  },

  /* ── 2. Кошельки ── */
  drips: {
    cover: 'img/collab-2.jpg',
    images: [],
    link: '',
    ru: {
      title: 'кофелёк',
      meta: 'коллаборация · 2026',
      lead: 'Кошелек для дрипов.',
      body: [
        'В рамках модульной работы совместно с основательницей Neo Mosaic было придумано и реализовано нескольок вариантов кошельков для дрипов и не только из кофейных пакетов и брелков из переработанного пластика.',
        'Получилось два вида кошельков и огромное количество брелков зверушек.'
      ]
    },
    en: {
      title: 'kofelok',
      meta: 'collaboration · 2026',
      lead: 'Drip bag wallet.',
      body: [
        'As part of a modular project, and in collaboration with the founder of Neo Mosaic, we designed and produced several versions of wallets—suitable for "drip" coffee packs and more—made from coffee bags, as well as keychains made from recycled plastic.',
        'The result was two types of wallets and a huge number of animal keychains.'
      ]
    }
  },

  /* ── 3. Пятнистый кот ── */
  cat: {
    cover: 'img/collab-3.png',
    images: [],
    link: '',
    ru: {
      title: 'Пятнистый кот',
      meta: 'коллаборация · 2025',
      lead: 'Вводная фраза о проекте.',
      body: [
        'Первый абзац рассказа.',
        'Второй абзац рассказа.'
      ]
    },
    en: {
      title: 'Spotted Cat',
      meta: 'collaboration · 2025',
      lead: 'An opening line about the project.',
      body: [
        'First paragraph of the story.',
        'Second paragraph of the story.'
      ]
    }
  },

  /* ── 4. Бабочка ── */
  butterfly: {
    cover: 'img/collab-4.png',
    images: [],
    link: '',
    ru: {
      title: 'Бабочка',
      meta: 'коллаборация · 2025',
      lead: 'Вводная фраза о проекте.',
      body: [
        'Первый абзац рассказа.',
        'Второй абзац рассказа.'
      ]
    },
    en: {
      title: 'Butterfly',
      meta: 'collaboration · 2025',
      lead: 'An opening line about the project.',
      body: [
        'First paragraph of the story.',
        'Second paragraph of the story.'
      ]
    }
  }

};

/* ═══════════ ДАЛЬШЕ МОЖНО НЕ ТРОГАТЬ ═══════════ */

const ORDER = ['crystals','mountain','cat','butterfly'];
let lang = 'ru';
let currentId = null;

const params = new URLSearchParams(location.search);
currentId = params.get('id') || ORDER[0];

const data = COLLABS[currentId];

if(!data){
  document.getElementById('notFound').style.display = 'block';
} else {
  document.getElementById('content').style.display = 'block';
  document.title = (data[lang] ? data[lang].title : currentId) + ' — prët';
  render();
}

function render(){
  const d = COLLABS[currentId];
  if(!d) return;
  const t = d[lang] || d.ru;

  document.getElementById('pTitle').textContent = t.title || '';
  document.getElementById('pMeta').textContent  = t.meta  || '';
  document.getElementById('pLead').textContent  = t.lead  || '';

  document.getElementById('pCover').src = d.cover || '';
  document.getElementById('pCover').alt = t.title || '';

  /* абзацы */
  const box = document.getElementById('pText');
  box.innerHTML = (t.body || []).map(p=>`<p>${p}</p>`).join('');

  /* галерея */
  const gSec = document.getElementById('pGallerySec');
  const gBox = document.getElementById('pGallery');
  if(d.images && d.images.length){
    gSec.style.display = 'block';
    gBox.innerHTML = d.images.map((src,i)=>
      `<img src="${src}" alt="${t.title || ''} ${i+1}" loading="lazy">`
    ).join('');
  } else {
    gSec.style.display = 'none';
  }

  /* внешняя ссылка */
  const lSec = document.getElementById('pLinkSec');
  const lEl  = document.getElementById('pLink');
  if(d.link){
    lSec.style.display = 'block';
    lEl.href = d.link;
  } else {
    lSec.style.display = 'none';
  }

  /* следующая коллаборация */
  const idx  = ORDER.indexOf(currentId);
  const next = ORDER[(idx + 1) % ORDER.length];
  const nd   = COLLABS[next];
  const nEl  = document.getElementById('pNext');
  nEl.textContent = (nd && nd[lang] ? nd[lang].title : next);
  nEl.href = 'collab.html?id=' + next;
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  lang = lang === 'ru' ? 'en' : 'ru';
  document.getElementById('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ru]').forEach(el=>{
    const v = el.getAttribute('data-' + lang);
    if(v !== null) el.innerHTML = v;
  });
  render();
});
</script>
</body>
</html>
