<!DOCTYPE html>
<html lang="ru" style="color-scheme:light !important;background:#FFF9F5 !important">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Магазин — prët</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;1,400&family=PT+Serif+Caption:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light !important;
    --navy:#0B1E3C;
    --cream:#FFF9F5;
    --ink:#2B1810;
    --display:'Averia Serif Libre','PT Serif Caption',Georgia,serif;
    --ui:'IBM Plex Sans',Arial,sans-serif;
    --hand:'Caveat','Comic Sans MS',cursive;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;color-scheme:light !important;background:#FFF9F5 !important}
  body{
    font-family:var(--display);
    color:#2B1810 !important;background:#FFF9F5 !important;
    line-height:1.6;overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    forced-color-adjust:none;
  }

  @media(prefers-color-scheme:dark){
    :root{color-scheme:light !important}
    html,body{background:#FFF9F5 !important;color:#2B1810 !important}
    .shop-hero{background:#0B1E3C !important;color:#FFF9F5 !important}
    .shop{background:#FFF9F5 !important}
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:24px 48px;
    background:rgba(255,249,245,.96);backdrop-filter:blur(10px);
  }
  .logo{font-family:var(--display);font-size:32px;font-style:italic;text-decoration:none;color:var(--ink);font-weight:400}
  nav{display:flex;gap:36px;align-items:center}
  nav a{
    text-decoration:none;color:var(--ink);font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;font-weight:500;font-family:var(--ui);
  }
  nav a:hover{opacity:.6}
  .lang-toggle{
    cursor:pointer;font-size:14px;padding:6px 12px;
    border:1px solid var(--ink);border-radius:4px;background:none;color:var(--ink);
    font-family:var(--ui);font-weight:500;
    transition:background .3s,color .3s;
  }
  .lang-toggle:hover{background:var(--ink);color:var(--cream)}

  .shop-hero{
    min-height:62vh;background:var(--navy);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:140px 48px 70px;text-align:center;
  }
  .shop-hero h1{
    font-family:var(--display);font-style:italic;font-weight:400;
    font-size:clamp(60px,10vw,120px);
    line-height:1;color:var(--cream);letter-spacing:-.02em;
  }
  .shop-hero p{
    font-family:var(--display);font-style:italic;
    font-size:clamp(18px,2.4vw,30px);
    color:var(--cream);opacity:.72;
    margin-top:26px;max-width:640px;line-height:1.35;
  }

  .shop{background:var(--cream);padding:90px 48px 110px;display:flex;justify-content:center}
  .notebook-wrap{
    position:relative;max-width:1100px;width:100%;
    perspective:1800px;
  }
  .notebook{
    position:relative;width:100%;
    aspect-ratio:1.6/1;
    background:#EFEAE3;
    border-radius:8px;
    box-shadow:0 16px 48px rgba(43,24,16,.22);
    display:flex;overflow:hidden;
  }
  .spiral{
    position:absolute;left:14px;top:50%;
    transform:translateY(-50%);width:28px;height:92%;
    display:flex;flex-direction:column;justify-content:space-around;
    align-items:center;z-index:3;
  }
  .ring{
    width:18px;height:18px;border-radius:50%;
    background:#1a1a1a;
    box-shadow:inset 0 2px 4px rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.4);
  }
  .page-left{
    flex:1;background:#F9F6F0;
    border-right:1px solid rgba(43,24,16,.12);
    padding:48px 34px 48px 56px;
    display:flex;flex-direction:column;gap:24px;
    position:relative;
  }
  .page-left::before{
    content:'';position:absolute;left:52px;top:20px;bottom:20px;
    width:1px;background:#E8796C;opacity:.45;
  }
  .page-right{
    flex:1;background:#FBF8F3;
    padding:48px 34px;
    display:flex;flex-direction:column;gap:24px;
    position:relative;
  }
  .page-item{
    display:flex;gap:16px;align-items:flex-start;
    opacity:0;
    animation:fadeIn .6s ease forwards;
  }
  .page-item:nth-child(1){animation-delay:.1s}
  .page-item:nth-child(2){animation-delay:.25s}
  .page-item:nth-child(3){animation-delay:.4s}
  .page-item:nth-child(4){animation-delay:.55s}
  @keyframes fadeIn{to{opacity:1}}

  .photo-box{
    width:clamp(110px,28%,140px);
    aspect-ratio:1/1;flex-shrink:0;
    background:#E8E2D8;
    border-radius:6px;
    position:relative;
    box-shadow:0 4px 12px rgba(43,24,16,.18);
  }
  .photo-box::before{
    content:'';position:absolute;top:-8px;left:50%;
    transform:translateX(-50%) rotate(-1deg);
    width:54%;height:18px;
    background:rgba(255,255,255,.68);
    border:1px solid rgba(0,0,0,.08);
    box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .coming-soon{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-style:italic;font-size:clamp(15px,1.8vw,22px);
    color:var(--ink);opacity:.55;text-align:center;
    padding:12px;line-height:1.2;
  }
  .item-text{flex:1;display:flex;flex-direction:column;gap:6px}
  .item-title{
    font-family:var(--display);font-style:italic;font-size:clamp(20px,2.4vw,28px);
    color:var(--ink);line-height:1.1;
  }
  .item-note{
    font-family:var(--ui);font-size:clamp(11px,1.2vw,13px);
    color:var(--ink);opacity:.6;line-height:1.5;
  }

  .flip-controls{
    position:absolute;bottom:24px;right:32px;
    display:flex;gap:12px;z-index:5;
  }
  .flip-btn{
    width:44px;height:44px;border-radius:50%;
    background:#1a1a1a;color:#FFF9F5;
    border:none;cursor:pointer;
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.28);
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .flip-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.36)}
  .flip-btn:disabled{opacity:.3;cursor:not-allowed}

  footer{background:var(--cream);padding:60px 48px 40px;text-align:center}
  footer p{
    font-size:14px;opacity:.6;font-family:var(--ui);
    letter-spacing:.08em;text-transform:uppercase;
  }

  @media(max-width:900px){
    header{padding:11px 16px}
    .logo{font-size:17px}
    nav{gap:9px}
    nav a{font-size:8px;letter-spacing:.07em}
    .lang-toggle{font-size:8px;padding:2px 5px}

    .shop-hero{padding:90px 16px 44px;min-height:auto}
    .shop-hero h1{font-size:clamp(34px,9.5vw,52px)}
    .shop-hero p{margin-top:18px;max-width:100%;font-size:clamp(15px,4.2vw,20px)}

    .shop{padding:44px 16px 70px}
    .notebook-wrap{max-width:420px}
    .notebook{
      aspect-ratio:0.7/1;
      flex-direction:column;
      background:#F6F1EA;
    }
    .spiral{
      left:50%;top:14px;
      transform:translateX(-50%);width:88%;height:28px;
      flex-direction:row;
    }
    .ring{width:16px;height:16px}
    .page-left{
      flex:1;border-right:none;border-bottom:1px solid rgba(43,24,16,.12);
      padding:48px 20px 28px;
    }
    .page-left::before{
      left:20px;right:20px;top:46px;bottom:auto;
      width:auto;height:1px;
    }
    .page-right{
      flex:1;padding:28px 20px 48px;
    }
    .page-item{flex-direction:column;gap:12px}
    .photo-box{width:100%;aspect-ratio:1.3/1;max-width:260px;margin:0 auto}
    .item-text{text-align:center}
    .item-title{font-size:clamp(18px,5vw,24px)}
    .item-note{font-size:clamp(10px,2.8vw,12px)}
    .coming-soon{font-size:clamp(13px,3.6vw,17px)}

    .flip-controls{bottom:16px;right:16px;gap:8px}
    .flip-btn{width:38px;height:38px;font-size:18px}

    footer{padding:36px 16px 24px}
    footer p{font-size:9px}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="./index.html">prët</a>
  <nav>
    <a href="./index.html#journey" data-ru="Галерея" data-en="Gallery">Галерея</a>
    <a href="./shop.html" data-ru="Магазин" data-en="Shop">Магазин</a>
    <a href="./about.html" data-ru="О&nbsp;себе" data-en="About">О&nbsp;себе</a>
    <a href="./index.html#contact" data-ru="Контакты" data-en="Contact">Контакты</a>
    <button class="lang-toggle" id="langBtn" type="button">EN</button>
  </nav>
</header>

<section class="shop-hero">
  <h1 data-ru="Магазин" data-en="Shop">Магазин</h1>
  <p data-ru="Здесь скоро появятся работы, которые можно забрать с собой"
     data-en="Works you can take with you will appear here soon">
    Здесь скоро появятся работы, которые можно забрать с собой
  </p>
</section>

<section class="shop">
  <div class="notebook-wrap">
    <div class="notebook" id="notebook">
      <div class="spiral">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
      </div>

      <div class="page-left" id="pageLeft"></div>
      <div class="page-right" id="pageRight"></div>

      <div class="flip-controls">
        <button class="flip-btn" id="prevBtn" type="button">‹</button>
        <button class="flip-btn" id="nextBtn" type="button">›</button>
      </div>
    </div>
  </div>
</section>

<footer>
  <p data-ru="© 2026 prët — maria balayan" data-en="© 2026 prët — maria balayan">© 2026 prët — maria balayan</p>
</footer>

<script>
  let currentLang = 'ru';

  function applyLang(){
    document.querySelectorAll('[data-ru]').forEach(el=>{
      const t = el.getAttribute('data-' + currentLang);
      if(t !== null) el.innerHTML = t;
    });
    document.getElementById('langBtn').textContent = currentLang === 'en' ? 'RU' : 'EN';
    document.documentElement.lang = currentLang;
    renderPage();
  }
  document.getElementById('langBtn').addEventListener('click', ()=>{
    currentLang = currentLang === 'ru' ? 'en' : 'ru';
    applyLang();
  });

  const COLORS = ['#F8C8DC','#D4E4F7','#FFF4C2','#D5EDD8','#FFD4B8','#E8D4F0','#C2E8E4','#FFDCE5'];
  const PAGES = [
    [
      { ru:'Принт 1', en:'Print 1', note:'60×80 см' },
      { ru:'Принт 2', en:'Print 2', note:'50×70 см' },
      { ru:'Открытка 1', en:'Postcard 1', note:'10×15 см' },
      { ru:'Открытка 2', en:'Postcard 2', note:'10×15 см' }
    ],
    [
      { ru:'Плакат 1', en:'Poster 1', note:'40×60 см' },
      { ru:'Плакат 2', en:'Poster 2', note:'40×60 см' },
      { ru:'Стикерпак', en:'Sticker pack', note:'12 шт' },
      { ru:'Зин 1', en:'Zine 1', note:'A5, 24 стр' }
    ]
  ];

  let currentPage = 0;

  function renderPage(){
    const data = PAGES[currentPage];

    const leftHTML = data.slice(0,2).map((item, i)=>{
      const ci = (currentPage * 4 + i) % COLORS.length;
      return `<div class="page-item">
        <div class="photo-box" style="background:${COLORS[ci]}">
          <div class="coming-soon" data-ru="скоро появится" data-en="coming soon">скоро появится</div>
        </div>
        <div class="item-text">
          <div class="item-title" data-ru="${item.ru}" data-en="${item.en}">${item[currentLang]}</div>
          <div class="item-note">${item.note}</div>
        </div>
      </div>`;
    }).join('');

    const rightHTML = data.slice(2,4).map((item, i)=>{
      const ci = (currentPage * 4 + 2 + i) % COLORS.length;
      return `<div class="page-item">
        <div class="photo-box" style="background:${COLORS[ci]}">
          <div class="coming-soon" data-ru="скоро появится" data-en="coming soon">скоро появится</div>
        </div>
        <div class="item-text">
          <div class="item-title" data-ru="${item.ru}" data-en="${item.en}">${item[currentLang]}</div>
          <div class="item-note">${item.note}</div>
        </div>
      </div>`;
    }).join('');

    document.getElementById('pageLeft').innerHTML = leftHTML;
    document.getElementById('pageRight').innerHTML = rightHTML;

    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage >= PAGES.length - 1;
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(currentPage > 0){ currentPage--; renderPage(); }
  });

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(currentPage < PAGES.length - 1){ currentPage++; renderPage(); }
  });

  renderPage();
</script>
</body>
</html>
