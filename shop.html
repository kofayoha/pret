<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — prët</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;1,400&family=Lora:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF6B47;
    --pink:#FFA6E6;
    --cream:#FFF9F5;
    --ink:#2B1810;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Lora',Georgia,serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
    overflow-x:hidden;
  }
  
  /* ---------- HEADER ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:24px 48px;
    background:rgba(255,249,245,.95);backdrop-filter:blur(8px);
  }
  .logo{font-family:'Averia Serif Libre',serif;font-size:32px;font-style:italic;text-decoration:none;color:var(--ink);font-weight:400}
  nav{display:flex;gap:36px;align-items:center}
  nav a{
    text-decoration:none;color:var(--ink);font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;font-weight:500;font-family:'IBM Plex Sans',Arial,sans-serif;
  }
  nav a:hover{opacity:.6}
  
  .lang-toggle{
    cursor:pointer;
    font-size:14px;
    padding:6px 12px;
    border:1px solid var(--ink);
    border-radius:4px;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    transition:background .3s, color .3s;
  }
  .lang-toggle:hover{
    background:var(--ink);
    color:var(--cream);
  }

  /* ---------- COMING SOON ---------- */
  .coming-soon{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:120px 48px 48px;
  }
  .coming-soon h1{
    font-size:clamp(80px,15vw,200px);
    font-style:italic;
    font-family:'Averia Serif Libre',serif;
    font-weight:400;
    margin-bottom:40px;
    color:var(--ink);
  }
  .coming-soon p{
    font-size:clamp(20px,3vw,36px);
    max-width:600px;
    opacity:.7;
  }
  .back-link{
    margin-top:60px;
    padding:14px 40px;
    text-decoration:underline;
    text-underline-offset:6px;
    color:var(--ink);
    font-size:16px;
    letter-spacing:.08em;
    font-family:'Averia Serif Libre',serif;
    font-style:italic;
  }
  .back-link:hover{
    opacity:.7;
  }

  @media(max-width:900px){
    header{padding:20px 24px}
    nav{gap:20px}
    nav a{font-size:11px}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">prët</a>
  <nav>
    <a href="index.html#journey" data-en="Gallery" data-ru="Галерея">Gallery</a>
    <a href="shop.html" data-en="Shop" data-ru="Магазин">Shop</a>
    <a href="index.html#artist" data-en="About" data-ru="О себе">About</a>
    <a href="index.html#contact" data-en="Contact" data-ru="Контакты">Contact</a>
    <span class="lang-toggle" onclick="toggleLanguage()">RU</span>
  </nav>
</header>

<div class="coming-soon">
  <h1 data-en="Coming Soon" data-ru="Ждите">Coming Soon</h1>
  <p data-en="The shop is being prepared. Stay tuned for updates." data-ru="Магазин в разработке. Следите за обновлениями.">The shop is being prepared. Stay tuned for updates.</p>
  <a class="back-link" href="index.html" data-en="← Back to Home" data-ru="← На главную">← Back to Home</a>
</div>

<script>
  let currentLang = 'en';
  
  function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'ru' : 'en';
    const langToggle = document.querySelector('.lang-toggle');
    langToggle.textContent = currentLang === 'en' ? 'RU' : 'EN';
    
    document.querySelectorAll('[data-en]').forEach(el => {
      const text = el.getAttribute(`data-${currentLang}`);
      if (text) {
        el.textContent = text;
      }
    });
    
    document.documentElement.lang = currentLang;
  }
</script>
</body>
</html>
