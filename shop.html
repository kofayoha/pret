<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0B1E3C">
<title>Магазин — prët</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;1,400&family=PT+Serif+Caption:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  forced-color-adjust:none;
  --navy:#0B1E3C;
  --cream:#FFF9F5;
  --ink:#2B1810;
  --disp:'Averia Serif Libre','PT Serif Caption',Georgia,serif;
  --ui:'IBM Plex Sans',Arial,sans-serif;
}
*,*::before,*::after{
  margin:0;padding:0;box-sizing:border-box;
  forced-color-adjust:none;
}
html{
  color-scheme:light only;
  background:#FFF9F5;
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}
body{
  font-family:var(--disp);
  color:#2B1810;
  background:#FFF9F5;
  line-height:1.6;
  overflow-x:hidden;
}

header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 48px;
  background:rgba(255,249,245,.96);
  backdrop-filter:blur(10px);
  color:#2B1810;
}
.logo{
  font-family:var(--disp);font-size:32px;font-style:italic;
  text-decoration:none;font-weight:400;
  color:#2B1810;-webkit-text-fill-color:#2B1810;
}
nav{display:flex;gap:32px;align-items:center}
nav a{
  text-decoration:none;
  color:#2B1810;-webkit-text-fill-color:#2B1810;
  font-family:var(--ui);font-size:12px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  transition:opacity .2s;
}
nav a:hover{opacity:.6}
.lang-toggle{
  font-size:12px;padding:5px 11px;
  border:1.5px solid #2B1810;border-radius:4px;
  background:none;cursor:pointer;
  font-family:var(--ui);font-weight:600;
  color:#2B1810;-webkit-text-fill-color:#2B1810;
  transition:background .2s,color .2s;
}
.lang-toggle:hover{
  background:#2B1810;
  color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
}

.shop-hero{
  min-height:58vh;background:#0B1E3C;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:140px 48px 70px;text-align:center;
}
.shop-hero h1{
  font-family:var(--disp);font-style:italic;font-weight:400;
  font-size:clamp(60px,10vw,120px);
  line-height:1;letter-spacing:-.02em;
  color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
}
.shop-hero p{
  font-family:var(--disp);font-style:italic;
  font-size:clamp(18px,2.4vw,30px);
  color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
  opacity:.72;margin-top:24px;max-width:640px;line-height:1.35;
}

/* ═════════ БЛОКНОТ ═════════
   Высота задаётся содержимым, не aspect-ratio — иначе на
   телефоне страницы обрезались. */
.shop{background:#FFF9F5;padding:80px 48px 110px;display:flex;justify-content:center}
.notebook{
  position:relative;
  width:100%;max-width:1080px;
  background:#E9E3DA;
  border-radius:10px;
  padding:26px 22px;
  box-shadow:0 18px 50px rgba(43,24,16,.20);
}
.spread{
  display:flex;
  gap:0;
  border-radius:6px;
  overflow:hidden;
  position:relative;
  min-height:520px;
}
/* кольца по центру разворота */
.rings{
  position:absolute;left:50%;top:0;bottom:0;
  transform:translateX(-50%);
  width:30px;z-index:4;
  display:flex;flex-direction:column;
  justify-content:space-evenly;align-items:center;
  pointer-events:none;
}
.ring{
  width:26px;height:26px;
  border:2.6px solid #9A9views;
  border-radius:50%;
}
.page{
  flex:1;min-width:0;
  background:#FCFAF6;
  padding:38px 30px;
  display:flex;flex-direction:column;gap:30px;
}
.page.left{
  border-right:1px solid rgba(43,24,16,.10);
  box-shadow:inset -14px 0 22px -16px rgba(43,24,16,.22);
}
.page.right{
  box-shadow:inset 14px 0 22px -16px rgba(43,24,16,.22);
}
.item{
  display:flex;gap:18px;align-items:flex-start;
  animation:rise .5s ease both;
}
.item:nth-child(2){animation-delay:.08s}
@keyframes rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
/* фото на скотче */
.photo{
  position:relative;flex:none;
  width:clamp(120px,32%,168px);
  aspect-ratio:1/1;
  border-radius:3px;
  box-shadow:0 5px 14px rgba(43,24,16,.20);
  display:flex;align-items:center;justify-content:center;
}
.photo::before,
.photo::after{
  content:'';position:absolute;
  width:46%;height:20px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(43,24,16,.09);
  box-shadow:0 1px 4px rgba(43,24,16,.14);
}
.photo::before{top:-9px;left:-6%;transform:rotate(-7deg)}
.photo::after{bottom:-9px;right:-6%;transform:rotate(-5deg)}
.photo span{
  font-family:var(--disp);font-style:italic;
  font-size:clamp(13px,1.5vw,17px);
  color:#2B1810;-webkit-text-fill-color:#2B1810;
  opacity:.5;text-align:center;padding:10px;line-height:1.25;
}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-top:4px}
.meta h3{
  font-family:var(--disp);font-style:italic;font-weight:400;
  font-size:clamp(19px,2.2vw,27px);
  line-height:1.15;
  color:#2B1810;-webkit-text-fill-color:#2B1810;
}
.meta p{
  font-family:var(--ui);font-size:clamp(11px,1.15vw,13px);
  color:#2B1810;-webkit-text-fill-color:#2B1810;
  opacity:.55;line-height:1.5;
}

.nav-row{
  display:flex;align-items:center;justify-content:center;
  gap:22px;margin-top:22px;
}
.flip{
  width:44px;height:44px;border-radius:50%;
  background:#1A1A1A;border:none;cursor:pointer;
  color:#FFF9F5;-webkit-text-fill-color:#FFF9F5;
  font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.26);
  transition:transform .2s,opacity .2s;
}
.flip:hover:not(:disabled){transform:translateY(-2px)}
.flip:disabled{opacity:.28;cursor:default}
.counter{
  font-family:var(--ui);font-size:12px;font-weight:600;
  letter-spacing:.16em;
  color:#2B1810;-webkit-text-fill-color:#2B1810;
  opacity:.5;min-width:58px;text-align:center;
}

footer{background:#FFF9F5;padding:60px 48px 40px;text-align:center}
footer p{
  font-size:13px;opacity:.55;font-family:var(--ui);
  letter-spacing:.1em;text-transform:uppercase;
  color:#2B1810;-webkit-text-fill-color:#2B1810;
}

/* ═════════ МОБИЛЬНАЯ ═════════
   Разворот превращается в вертикальную папку: кольца сверху,
   страницы друг под другом, высота свободная. */
@media(max-width:900px){
  header{padding:10px 16px}
  .logo{font-size:18px}
  nav{gap:8px}
  nav a{font-size:8px;letter-spacing:.06em}
  .lang-toggle{font-size:8px;padding:2px 6px}

  .shop-hero{padding:88px 16px 44px;min-height:auto}
  .shop-hero h1{font-size:clamp(34px,9.5vw,52px)}
  .shop-hero p{margin-top:16px;max-width:100%;font-size:clamp(14px,4vw,19px)}

  .shop{padding:34px 14px 60px}
  .notebook{
    max-width:100%;
    padding:16px 12px 14px;
    border-radius:8px;
  }
  .spread{
    flex-direction:column;
    min-height:0;           /* снимаем жёсткую высоту — не режет */
    padding-top:30px;       /* место под кольца */
  }
  /* кольца сверху, горизонтально */
  .rings{
    left:0;right:0;top:0;bottom:auto;
    transform:none;
    width:auto;height:30px;
    flex-direction:row;
    justify-content:space-evenly;
  }
  .ring{width:19px;height:19px;border-width:2.2px}

  .page{padding:20px 16px;gap:22px}
  .page.left{
    border-right:none;
    border-bottom:1px dashed rgba(43,24,16,.18);
    box-shadow:none;
  }
  .page.right{box-shadow:none}

  .item{gap:13px;align-items:center}
  .photo{
    width:clamp(96px,34%,124px);
    border-radius:2px;
  }
  .photo::before,.photo::after{height:15px;width:50%}
  .photo span{font-size:clamp(11px,3vw,13px);padding:7px}
  .meta{gap:5px;padding-top:0}
  .meta h3{font-size:clamp(16px,4.4vw,20px)}
  .meta p{font-size:clamp(10px,2.7vw,12px)}

  .nav-row{gap:16px;margin-top:16px}
  .flip{width:38px;height:38px;font-size:17px}
  .counter{font-size:10px;min-width:48px}

  footer{padding:34px 16px 22px}
  footer p{font-size:9px}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="./index.html">prët</a>
  <nav>
    <a href="./index.html#journey" data-ru="Галерея" data-en="Gallery">Галерея</a>
    <a href="./shop.html" data-ru="Магазин" data-en="Shop">Магазин</a>
    <a href="./about.html" data-ru="О&nbsp;себе" data-en="About">О&nbsp;себе</a>
    <a href="./index.html#contact" data-ru="Контакты" data-en="Contact">Контакты</a>
    <button class="lang-toggle" id="langBtn" type="button">EN</button>
  </nav>
</header>

<section class="shop-hero">
  <h1 data-ru="Магазин" data-en="Shop">Магазин</h1>
  <p data-ru="Здесь скоро появятся работы, которые можно забрать с собой"
     data-en="Works you can take with you will appear here soon">
    Здесь скоро появятся работы, которые можно забрать с собой
  </p>
</section>

<section class="shop">
  <div class="notebook">
    <div class="spread">
      <div class="rings">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
      </div>
      <div class="page left" id="pageLeft"></div>
      <div class="page right" id="pageRight"></div>
    </div>

    <div class="nav-row">
      <button class="flip" id="prevBtn" type="button" aria-label="Назад">‹</button>
      <span class="counter" id="counter">1 / 3</span>
      <button class="flip" id="nextBtn" type="button" aria-label="Вперёд">›</button>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 prët — maria balayan</p>
</footer>

<script>
let lang = 'ru';

const SOON = { ru:'скоро появится', en:'coming soon' };

/* цветные блоки вместо фотографий */
const TONES = ['#F6C9DA','#CFE0F4','#FBF0BE','#D3EAD6','#FCD3B6','#E4D2EE','#C0E5E2','#F9D6DF'];

const PAGES = [
  [
    { ru:'Принт «Линия»',    en:'Print “Line”',     note:'60×80 см · бумага 300 г' },
    { ru:'Принт «Энергия»',  en:'Print “Energy”',   note:'50×70 см · бумага 300 г' },
    { ru:'Открытка I',       en:'Postcard I',       note:'10×15 см · набор 3 шт' },
    { ru:'Открытка II',      en:'Postcard II',      note:'10×15 см · набор 3 шт' }
  ],
  [
    { ru:'Плакат «Тело»',    en:'Poster “Body”',    note:'40×60 см · офсет' },
    { ru:'Плакат «Искры»',   en:'Poster “Sparks”',  note:'40×60 см · офсет' },
    { ru:'Стикерпак',        en:'Sticker pack',     note:'12 наклеек · винил' },
    { ru:'Зин «Посестрие»',  en:'Zine “Posestrie”', note:'A5 · 24 страницы' }
  ],
  [
    { ru:'Керамика I',       en:'Ceramics I',       note:'ручная лепка · глазурь' },
    { ru:'Керамика II',      en:'Ceramics II',      note:'ручная лепка · глазурь' },
    { ru:'Украшение из бисера', en:'Beaded piece',  note:'ручная работа' },
    { ru:'Линогравюра',      en:'Linocut',          note:'30×40 см · тираж 10' }
  ]
];

let page = 0;

function card(item, tone){
  const title = lang === 'en' ? item.en : item.ru;
  return `<div class="item">
    <div class="photo" style="background:${tone}">
      <span>${SOON[lang]}</span>
    </div>
    <div class="meta">
      <h3>${title}</h3>
      <p>${item.note}</p>
    </div>
  </div>`;
}

function render(){
  const data = PAGES[page];
  const base = page * 4;

  document.getElementById('pageLeft').innerHTML =
    data.slice(0,2).map((it,i)=> card(it, TONES[(base+i) % TONES.length])).join('');

  document.getElementById('pageRight').innerHTML =
    data.slice(2,4).map((it,i)=> card(it, TONES[(base+2+i) % TONES.length])).join('');

  document.getElementById('counter').textContent = `${page+1} / ${PAGES.length}`;
  document.getElementById('prevBtn').disabled = page === 0;
  document.getElementById('nextBtn').disabled = page === PAGES.length - 1;
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(page > 0){ page--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(page < PAGES.length - 1){ page++; render(); }
});

/* свайп по развороту на телефоне */
let tx = 0;
const spread = document.querySelector('.spread');
spread.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
spread.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) < 50) return;
  if(dx < 0 && page < PAGES.length - 1){ page++; render(); }
  if(dx > 0 && page > 0){ page--; render(); }
}, {passive:true});

function setLang(l){
  lang = l;
  document.querySelectorAll('[data-ru]').forEach(el=>{
    const t = el.getAttribute('data-'+l);
    if(t !== null) el.innerHTML = t;
  });
  document.getElementById('langBtn').textContent = l === 'ru' ? 'EN' : 'RU';
  document.documentElement.lang = l;
  render();
}
document.getElementById('langBtn').addEventListener('click',
  ()=> setLang(lang === 'ru' ? 'en' : 'ru'));

render();
</script>
</body>
</html>
