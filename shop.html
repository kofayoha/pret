<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#0B1E3C">
<title>Магазин — prët</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;1,400&family=PT+Serif+Caption:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light only;
    --navy:#0B1E3C;
    --blue:#4A7BA7;
    --cream:#FFF9F5;
    --ink:#2B1810;
    --rose:#F49BC0;
    --coral:#E8552F;
    --display:'Averia Serif Libre','PT Serif Caption','Lora',Georgia,serif;
    --ui:'IBM Plex Sans',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;color-scheme:light only}
  body{
    font-family:'PT Serif Caption','Lora',Georgia,serif;
    color:var(--ink);background:var(--cream);
    line-height:1.6;overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:24px 48px;
    background:rgba(255,249,245,.95);backdrop-filter:blur(8px);
  }
  .logo{font-family:var(--display);font-size:32px;font-style:italic;text-decoration:none;color:var(--ink);font-weight:400}
  nav{display:flex;gap:36px;align-items:center}
  nav a{
    text-decoration:none;color:var(--ink);font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;font-weight:500;font-family:var(--ui);
  }
  nav a:hover{opacity:.6}
  .lang-toggle{
    cursor:pointer;font-size:14px;padding:6px 12px;
    border:1px solid var(--ink);border-radius:4px;background:none;color:var(--ink);
    font-family:var(--ui);font-weight:500;
    transition:background .3s,color .3s;
  }
  .lang-toggle:hover{background:var(--ink);color:var(--cream)}

  /* ── ХИРО: тот же стиль, что «Мария Балаян» в о себе ── */
  .shop-hero{
    min-height:62vh;background:var(--navy);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:140px 48px 70px;text-align:center;
  }
  .shop-hero h1{
    font-family:var(--display);font-style:italic;font-weight:400;
    font-size:clamp(60px,10vw,120px);
    line-height:1;color:var(--cream);letter-spacing:-.02em;
  }
  .shop-hero p{
    font-family:var(--display);font-style:italic;
    font-size:clamp(18px,2.4vw,30px);
    color:var(--cream);opacity:.72;
    margin-top:26px;max-width:640px;line-height:1.35;
  }

  /* ── ТОВАРЫ ── */
  .shop{background:var(--cream);padding:90px 48px 110px}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:56px 40px;
    max-width:1180px;margin:0 auto;
  }
  .product{cursor:pointer;display:block;text-align:center}
  .product-img{
    aspect-ratio:1/1;border-radius:14px;
    background:#FBF1EE;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    transition:transform .45s cubic-bezier(.34,1.1,.5,1), box-shadow .45s;
    box-shadow:0 10px 26px rgba(43,24,16,.10);
  }
  .product:hover .product-img{
    transform:translateY(-10px) rotate(-1deg);
    box-shadow:0 22px 48px rgba(43,24,16,.18);
  }
  .product-img svg{width:70%;height:70%;display:block}
  .product-name{
    font-family:var(--display);font-style:italic;
    font-size:clamp(20px,2vw,27px);
    margin-top:22px;color:var(--ink);
  }
  .product-price{
    font-family:var(--ui);font-size:13px;
    letter-spacing:.1em;color:var(--ink);opacity:.5;
    margin-top:6px;
  }

  footer{background:var(--cream);padding:60px 48px 40px;text-align:center}
  footer p{
    font-size:14px;opacity:.6;font-family:var(--ui);
    letter-spacing:.08em;text-transform:uppercase;
  }

  @media(max-width:900px){
    header{padding:14px 20px}
    .logo{font-size:20px}
    nav{gap:10px}
    nav a{font-size:9px}
    .lang-toggle{font-size:9px;padding:3px 7px}

    .shop-hero{padding:104px 20px 52px;min-height:auto}
    .shop-hero p{margin-top:18px;max-width:100%}

    .shop{padding:52px 20px 70px}
    .grid{grid-template-columns:repeat(2,1fr);gap:34px 18px}
    .product-name{margin-top:14px}
    .product-price{font-size:11px}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="./index.html">prët</a>
  <nav>
    <a href="./index.html#journey" data-ru="Галерея" data-en="Gallery">Галерея</a>
    <a href="./shop.html" data-ru="Магазин" data-en="Shop">Магазин</a>
    <a href="./about.html" data-ru="О&nbsp;себе" data-en="About">О&nbsp;себе</a>
    <a href="./index.html#contact" data-ru="Контакты" data-en="Contact">Контакты</a>
    <button class="lang-toggle" id="langBtn" type="button">EN</button>
  </nav>
</header>

<section class="shop-hero">
  <h1 data-ru="Магазин" data-en="Shop">Магазин</h1>
  <p data-ru="Здесь скоро появятся работы, которые можно забрать с собой"
     data-en="Works you can take with you will appear here soon">
    Здесь скоро появятся работы, которые можно забрать с собой
  </p>
</section>

<section class="shop">
  <div class="grid" id="grid"></div>
</section>

<footer>
  <p data-ru="© 2026 prët — maria balayan" data-en="© 2026 prët — maria balayan">© 2026 prët — maria balayan</p>
</footer>

<script>
  /* ═════════ РАКУШКА ═════════
     Пока вместо фотографий товаров — нарисованная ракушка
     в палитре картинки: розовое тело, коралловые шипы,
     спираль в центре. Одна SVG переиспользуется сеткой. */
  function shellSVG(id, seed){
    return `
    <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="body${id}" cx="42%" cy="44%" r="72%">
          <stop offset="0%"  stop-color="#FBD3E4"/>
          <stop offset="55%" stop-color="#F49BC0"/>
          <stop offset="100%" stop-color="#EE7FAE"/>
        </radialGradient>
        <linearGradient id="spike${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#F0452A"/>
          <stop offset="70%" stop-color="#E8552F"/>
          <stop offset="100%" stop-color="#D93A2B"/>
        </linearGradient>
        <filter id="soft${id}">
          <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8A3350" flood-opacity="0.22"/>
        </filter>
      </defs>

      <g filter="url(#soft${id})">
        <!-- шипы -->
        <polygon points="215.4,51.2 225.9,90.2 266.9,97.5 253.2,136.9 295.2,165.7 250.9,190.9 281.0,245.2 219.7,235.2 211.1,285.7 169.6,255.5 137.2,281.8 116.5,245.6 76.2,248.8 77.1,208.4 41.6,189.4 64.1,155.9 44.5,120.7 81.5,104.7 84.1,64.5 123.9,71.1 147.8,38.6 177.7,65.6"
                 fill="url(#spike${id})"/>
        <!-- тело -->
        <circle cx="160" cy="160" r="96" fill="url(#body${id})"/>
        <!-- внутренние сгустки коралла -->
        <path d="M160 64 A96 96 0 0 1 253 134" fill="none"
              stroke="#EE6A38" stroke-width="12" stroke-linecap="round" opacity=".55"/>
        <path d="M256 178 A96 96 0 0 1 214 246" fill="none"
              stroke="#EE6A38" stroke-width="12" stroke-linecap="round" opacity=".55"/>
        <path d="M110 240 A96 96 0 0 1 62 168" fill="none"
              stroke="#EE6A38" stroke-width="12" stroke-linecap="round" opacity=".55"/>
        <!-- спираль -->
        <path d="M166.0 160.0L166.4 161.3L166.6 162.7L166.4 164.2L165.9 165.8L165.0 167.3L163.7 168.6L162.1 169.7L160.3 170.5L158.1 170.9L155.9 170.9L153.6 170.4L151.3 169.4L149.2 167.8L147.4 165.9L146.0 163.5L145.0 160.7L144.6 157.7L144.8 154.6L145.6 151.5L147.1 148.5L149.2 145.8L151.8 143.5L155.0 141.7L158.6 140.5L162.4 140.0L166.4 140.3L170.3 141.4L174.1 143.3L177.4 146.0L180.3 149.3L182.5 153.3L183.9 157.7L184.5 162.4L184.1 167.2L182.8 172.0L180.5 176.5L177.3 180.5L173.3 184.0L168.7 186.6L163.4 188.4L157.9 189.1L152.2 188.6L146.6 187.1L141.3 184.5L136.5 180.8L132.5 176.2L129.3 170.8L127.3 164.8L126.4 158.4L126.8 151.8L128.5 145.3L131.4 139.2L135.6 133.7L140.8 129.0L146.9 125.4L153.7 122.9L160.9 121.9L168.4 122.2L175.7 124.0L182.6 127.2L188.9 131.8L194.3 137.5L198.5 144.3L201.3 151.9L202.7 160.0L202.4 168.3L200.6 176.5L197.1 184.3L192.1 191.4L185.8 197.4L178.4 202.2L170.1 205.5L161.1 207.2L152.0 207.1L142.9 205.2L134.2 201.5L126.3 196.2L119.5 189.4"
              fill="none" stroke="#F08A3C" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round"/>
        <!-- блик -->
        <ellipse cx="128" cy="118" rx="26" ry="16" fill="#FFF" opacity=".28"
                 transform="rotate(-32 128 118)"/>
      </g>
    </svg>`;
  }

  /* Пока все товары — ракушка. Замените name/price,
     когда появятся работы. */
  const PRODUCTS = [
    { ru:'Ракушка I',   en:'Shell I',   price:'скоро' },
    { ru:'Ракушка II',  en:'Shell II',  price:'скоро' },
    { ru:'Ракушка III', en:'Shell III', price:'скоро' },
    { ru:'Ракушка IV',  en:'Shell IV',  price:'скоро' },
    { ru:'Ракушка V',   en:'Shell V',   price:'скоро' },
    { ru:'Ракушка VI',  en:'Shell VI',  price:'скоро' }
  ];

  let currentLang = 'ru';

  function render(){
    document.getElementById('grid').innerHTML = PRODUCTS.map((p,i)=>`
      <div class="product">
        <div class="product-img">${shellSVG(i, i)}</div>
        <div class="product-name">${currentLang === 'en' ? p.en : p.ru}</div>
        <div class="product-price">${p.price}</div>
      </div>`).join('');
  }

  function applyLang(){
    document.querySelectorAll('[data-ru]').forEach(el=>{
      const t = el.getAttribute('data-' + currentLang);
      if(t !== null) el.innerHTML = t;
    });
    document.getElementById('langBtn').textContent = currentLang === 'en' ? 'RU' : 'EN';
    document.documentElement.lang = currentLang;
    render();
  }

  document.getElementById('langBtn').addEventListener('click', ()=>{
    currentLang = currentLang === 'ru' ? 'en' : 'ru';
    applyLang();
  });

  render();
</script>
</body>
</html>
